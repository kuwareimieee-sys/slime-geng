<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skin Geng Alive</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: -apple-system, sans-serif;
            background:#0a0a0a; color:#fff;
            min-height:100vh; display:flex; align-items:center; justify-content:center;
        }
        .container { text-align:center; padding:20px; }
        .icon { width:150px; height:150px; margin-bottom:30px; object-fit:contain; }
        .join-button {
            background:#dc2626; color:white; border:none; padding:20px 40px;
            font-size:18px; font-weight:bold; cursor:pointer; transition:background .2s;
            margin-bottom:20px;
        }
        .join-button:hover { background:#b91c1c; }
        .counter { color:#6b7280; font-size:14px; }
    </style>
</head>
<body>
    <div class="container">
        <img src="YOUR_ICON_URL_HERE" alt="Icon" class="icon">
        <button class="join-button" onclick="joinPetition()">Join the petition to skin geng alive!</button>
        <div class="counter">Joined users: <span id="count">0</span></div>
    </div>
    <script>
        async function joinPetition() {
            try { await fetch('/api/counter', { method:'POST' }); } catch(e){}
            window.location.href = '/thank-you#';
        }
        async function updateCounter() {
            try {
                const r = await fetch('/api/counter');
                const d = await r.json();
                document.getElementById('count').textContent = d.count;
            } catch(e){}
        }
        updateCounter(); setInterval(updateCounter, 5000);
    </script>
</body>
</html>
